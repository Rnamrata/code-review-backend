name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*.*.*']          # a release: v0.2.0 publishes the image as 0.2.0, 0.2 and latest
  workflow_dispatch:

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']   # package.json engines: >=20.19

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install "ruff==0.17.0"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit (informational)
        run: npm audit --omit=dev
        continue-on-error: true
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `load` keeps the image on the runner so the smoke test can start it. The layers are cached,
      # so the publish job below builds the same amd64 image from the cache instead of again.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: code-review-backend:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the image and checks health, a real review (ESLint and Ruff), the non-root user
      # and a clean stop. `bash` is used so the script needs no executable bit.
      - name: Smoke test the image
        run: bash scripts/docker-smoke-test.sh code-review-backend:ci

  # Publishes the image to GitHub's container registry, only after every check above passed and
  # only for a push to master (tag: edge) or a version tag (tags: 1.2.3, 1.2, latest). A pull
  # request never publishes. The job alone gets permission to write packages.
  publish:
    name: publish image
    needs: [build, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40       # the arm64 half is built under emulation, which is slow

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # A release tag must name the version in package.json (which openapi.yaml must match too,
      # a test checks that), so the image called 0.2.0 really is version 0.2.0.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the version in package.json (${version})." >&2
            exit 1
          fi

      # Registry names must be lower case, and the owner name is not.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (to build the arm64 image)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and labels (source repository, commit, version, build time) for the image.
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=code-review-backend
            org.opencontainers.image.description=Stateless code-review service: ESLint, Ruff and an optional local LLM behind one POST /review endpoint

      # amd64 comes from the cache of the tested build; arm64 (Apple Silicon, ARM servers) is built here.
      - name: Build and push the image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Pulls what was really published (by its digest) and runs the same smoke test on it.
      - name: Smoke test the published image
        run: |
          docker pull "${IMAGE}@${{ steps.push.outputs.digest }}"
          bash scripts/docker-smoke-test.sh "${IMAGE}@${{ steps.push.outputs.digest }}"
